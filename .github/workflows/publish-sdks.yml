name: Publish Processing API SDKs
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Registry target
        required: true
        type: choice
        options: [pypi, npm, both]
        default: both
permissions:
  contents: read
jobs:
  pypi:
    if: github.event_name == 'release' || inputs.target == 'pypi' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python SDK test dependencies
        run: python -m pip install -e sdk/python
      - name: Test Python SDK
        run: python -m unittest discover -s sdk/tests -p test_python.py -v
      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist sdk/python
      - name: Publish by PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
  npm:
    if: github.event_name == 'release' || inputs.target == 'npm' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure OIDC-compatible npm CLI
        run: npm install --global npm@^11
      - name: Test JavaScript SDK
        run: node --test sdk/tests/test_javascript.mjs
      - name: Publish by npm Trusted Publisher
        working-directory: sdk/javascript
        run: npm publish --access public --provenance
